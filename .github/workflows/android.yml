name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth: read the version out of the wrapper properties so
  # the CI toolchain can never drift from what the project declares.
  GRADLE_VERSION: 8.7

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # No artifact upload: the debug APK is shipped straight to the releases
      # page as a rolling pre-release, so it can be downloaded straight from
      # the browser without signing keys.
      - name: Publish debug APK as pre-release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Debug build ${{ github.run_number }}
          prerelease: true
          body: |
            Automatic debug build of `main` at `${{ github.sha }}`.

            Installed straight from the browser; it is not signed with a release
            key, so uninstall any previous build before installing this one.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

  release:
    name: Signed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        env:
          STORE_FILE: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in STORE_FILE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository secret $var is not set; cannot sign the release."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          printf '%s' "$STORE_FILE" | base64 --decode > "$RUNNER_TEMP/quickscan.jks"

      - name: Write keystore properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "storeFile=$RUNNER_TEMP/quickscan.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble signed APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          fail_on_unmatched_files: true