org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Off because AGP 8.5 cannot serialise the lint model for the androidTest
# source set, and it fails the build while *storing* the cache rather than
# reporting a problem — so org.gradle.configuration-cache.problems=warn does
# not cover it. The instrumentation tests are what put that model on the
# graph. Upgrading AGP is the real fix; it costs every compile error in the
# project back, which is the wrong trade without a way to build locally.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official