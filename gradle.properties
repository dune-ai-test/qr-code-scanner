org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# AGP 8.5 cannot serialise the lint model for the androidTest source set, and
# it reports that as a configuration-cache error rather than a lint finding,
# so the default would fail a build that has no problems in it. Gradle then
# declines to cache the affected task and carries on. Remove this once AGP can
# serialise it — a silent fallback is easy to forget is there.
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official